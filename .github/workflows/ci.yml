name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned, never `@stable`: a floating channel lets upstream lint additions
      # turn `main` red with no code change (clippy 1.98 did exactly that).
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      # Without this every run recompiles the whole dependency graph on all three
      # platforms — and this job builds *two* of them (default, then `winrm`, which
      # pulls tokio + reqwest + rustls). Keyed on the toolchain and Cargo.lock, so a
      # compiler or lockfile change starts a fresh cache instead of restoring a stale
      # one; `cache-on-failure` keeps the saving even when a gate fails.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check winrm feature compiles
        run: cargo check --features winrm --all-targets
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Test (winrm feature)
        run: cargo test --features winrm

  # MSRV gate: the version declared in `rust-version` must actually compile.
  # The explicit `+1.88.0` matters — rust-toolchain.toml pins the default to
  # 1.97.0, so a bare `cargo check` here would silently test the wrong compiler.
  # The version banner is printed so such a fallback is visible in the log.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check MSRV (Cargo.toml rust-version)
        run: |
          rustc +1.88.0 -V
          cargo +1.88.0 -V
          cargo +1.88.0 check --all-targets

  # Release assets follow a fixed `unirun-<os>-<arch>` naming contract so
  # consumers (Dockerfiles, install scripts, agent toolchains) can resolve the
  # right file deterministically. Runners are pinned to versions whose
  # architecture is known (no `-latest` drift), and each matrix row builds for
  # an explicit rustc target that matches the runner's native arch.
  #
  #   unirun-linux-x86_64          Linux x86_64 (glibc)
  #   unirun-linux-x86_64-musl     Linux x86_64 (static musl — Alpine/musl Docker)
  #   unirun-linux-aarch64-musl    Linux arm64 (static musl — ARM NAS, Pi)
  #   unirun-macos-aarch64         macOS Apple Silicon
  #   unirun-windows-x86_64.exe    Windows x86_64
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: unirun-linux-x86_64
            bin: unirun
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: unirun-linux-x86_64-musl
            bin: unirun
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: unirun-linux-aarch64-musl
            bin: unirun
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: unirun-macos-aarch64
            bin: unirun
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: unirun-windows-x86_64.exe
            bin: unirun.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      # Same cache reasoning as the test job: five targets across three runners,
      # all of them compiling the full dependency graph for a tag-time build.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # `--target <triple>` puts artifacts under target/<triple>, so the cache
          # key has to include the triple or the five rows would share one entry.
          key: ${{ matrix.target }}
      - name: Build dist binary (${{ matrix.target }})
        # Shipped assets come from the `dist` profile, where the size knobs live.
        # The test matrix above keeps plain `--release` for its compile check, and
        # `--release` is now cargo's default profile, so only this tag-time
        # packaging job pays the fat-LTO wall-clock cost.
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Stage asset as ${{ matrix.asset }}
        shell: bash
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/dist/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # Single job owns release creation/upload so matrix assets never race or
  # overwrite each other (the same-name overwrite bug this matrix fixes).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the crate version ships binaries whose name
      # lies about their contents and leaves tag↔crate drift behind (v0.2.1 has
      # a tag but was never published). Refuse before the release exists.
      - name: Assert the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"; exit 1; }
          echo "tag ${GITHUB_REF_NAME} matches Cargo.toml ${version}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify staged assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
