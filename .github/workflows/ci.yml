name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check winrm feature compiles
        run: cargo check --features winrm --all-targets
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  # Release assets follow a fixed `unirun-<os>-<arch>` naming contract so
  # consumers (Dockerfiles, install scripts, agent toolchains) can resolve the
  # right file deterministically. Runners are pinned to versions whose
  # architecture is known (no `-latest` drift), and each matrix row builds for
  # an explicit rustc target that matches the runner's native arch.
  #
  #   unirun-linux-x86_64          Linux x86_64 (glibc)
  #   unirun-linux-x86_64-musl     Linux x86_64 (static musl — Alpine/musl Docker)
  #   unirun-linux-aarch64-musl    Linux arm64 (static musl — ARM NAS, Pi)
  #   unirun-macos-aarch64         macOS Apple Silicon
  #   unirun-windows-x86_64.exe    Windows x86_64
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: unirun-linux-x86_64
            bin: unirun
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: unirun-linux-x86_64-musl
            bin: unirun
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: unirun-linux-aarch64-musl
            bin: unirun
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: unirun-macos-aarch64
            bin: unirun
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: unirun-windows-x86_64.exe
            bin: unirun.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset as ${{ matrix.asset }}
        shell: bash
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # Single job owns release creation/upload so matrix assets never race or
  # overwrite each other (the same-name overwrite bug this matrix fixes).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify staged assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
