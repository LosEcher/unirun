[package]
name = "unirun"
version = "0.4.0"
edition = "2021"
# Verified by `cargo +1.88.0 check --all-targets` and gated in CI (msrv job).
# Drivers: `usize::is_multiple_of` (1.87) and `<[T]>::as_chunks` (1.88).
rust-version = "1.88"
description = "Cross-platform command execution normalization for AI agents — one command spec in, one normalized result out, on any platform."
license = "MIT"
repository = "https://github.com/LosEcher/unirun"
keywords = ["exec", "cross-platform", "agent", "mcp", "normalization"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "0.8"
base64 = "0.22"
psrp-rs = { version = "1", optional = true }
winrm-rs = { version = "1", optional = true }

[[bin]]
name = "unirun"
path = "src/main.rs"

[features]
default = []
winrm = ["dep:psrp-rs", "dep:winrm-rs"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "exec_bench"
harness = false

# --- Shipped-artifact size ---------------------------------------------------------------
# Measured, not guessed: this combination is substantially smaller than the default release
# profile, while `opt-level = "z"` on its own is *larger* than the default `opt-level = 3`
# here. Single-knob comparisons mislead; only the measured combination is meaningful.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# `strip` removes the symbol table (a real size win for the shipped binary) but also makes
# `cargo bloat` / `nm` useless. For size analysis, override it for a single build:
#   cargo build --release --config 'profile.release.strip="none"'
# `panic = "abort"` is deliberately NOT set: it changes crash behaviour from unwinding
# (exit 101) to SIGABRT (exit 134), and exit codes are part of this tool's contract.

# Benches inherit `release`, but they must stay comparable with historical numbers and must
# not pay fat-LTO build times: keep the pre-size-tuning optimisation level here.
[profile.bench]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = "none"

# cargo never reclaims `target/*/incremental`, and it ends up dwarfing the working set it
# accelerates. Off here; the cost is a few seconds per crate when recompiling.
[profile.dev]
incremental = false
