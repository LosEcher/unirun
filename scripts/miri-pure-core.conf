# miri-pure-core.conf — unirun
#
# The pure core: decoding, output coalescing, error taxonomy, heredoc risk
# scanning. All four are byte-in/decision-out with no clock, no filesystem, no
# environment — which is exactly the set Miri can prove. `exec` /
# `process_identity` / `transport` / `session` spawn processes or read /proc, so
# they are out of scope by construction and stay covered by the integration
# tests and real-machine runs.
MIRI_FILTERS=(encoding:: coalesce:: taxonomy:: heredoc::)
MIRI_MIN_PASSED=45
MIRI_TARGET=lib
